<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio DPW2 - Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid dashboard-wrapper">
        <div class="row min-vh-100">
            <aside class="col-12 col-md-3 col-lg-2 sidebar p-4">
                <h2 class="h5 mb-4">Panel Admin</h2>
                <nav class="nav flex-column gap-2">
                    <a class="nav-link active section-link" href="#" data-section="1">1</a>
                    <a class="nav-link section-link" href="#" data-section="2">2</a>
                    <a class="nav-link section-link" href="#" data-section="3">3</a>
                    
                </nav>
            </aside>

            <main class="col-12 col-md-9 col-lg-10 main-content p-4 p-md-5 d-flex align-items-center justify-content-center">
                <h1 id="section-display" class="display-3 mb-0">1</h1>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sectionLinks = document.querySelectorAll('.section-link');
        const sectionDisplay = document.getElementById('section-display');

        sectionLinks.forEach((link) => {
            link.addEventListener('click', (event) => {
                event.preventDefault();

                sectionLinks.forEach((item) => item.classList.remove('active'));
                link.classList.add('active');

                const selectedSection = link.dataset.section;
                sectionDisplay.textContent = selectedSection;
            });
        });
    </script>
</body>
</html>
